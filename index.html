<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천명</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gowun+Batang:wght@400;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 레이아웃: 한 줄기 두루마리 — 상단 수치, 가운데 장면, 아래 선택지. 당삼채(唐三彩) 유약색을 단일 어두운 화면에 */
:root {
  --bg: #0f201d;        /* 짙은 청자 그늘 */
  --panel: #162e29;
  --line: #2c4a42;
  --paper: #ece2cb;     /* 마지(麻紙) 글자색 */
  --dim: #a9b5a6;
  --amber: #d49b3c;     /* 삼채 황유 */
  --green: #86b273;     /* 삼채 녹유 */
  --cinnabar: #cf5b3f;  /* 주사 */
  --f-display: "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "Gowun Batang", "AppleMyungjo", serif;
  --f-han: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--paper); font-family: var(--f-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background-image: radial-gradient(ellipse at 50% -10%, #1d3b34 0%, transparent 60%);
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: .02em; margin: 0; }
.logo span { font-family: var(--f-han); color: var(--amber); font-weight: 700; margin-right: .3em; }
.tools { display: flex; gap: 8px; }
button { font: inherit; cursor: pointer; }
.ghost { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 3px 10px; font-size: .82rem; }
.ghost:hover { color: var(--paper); border-color: var(--dim); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 4px; }
.stat .lab { display: flex; justify-content: space-between; font-size: .78rem; color: var(--dim); letter-spacing: .04em; }
.stat .lab b { color: var(--paper); font-variant-numeric: tabular-nums; font-weight: 700; }
.bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; transition: width .5s ease; }
.s-hp i { background: var(--cinnabar); } .s-gold i { background: var(--amber); } .s-army i { background: var(--green); } .s-fame i { background: var(--paper); }
.eyebrow.ev { color: var(--cinnabar); }
.choice:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); background: transparent; }
.delta { font-size: .72rem; margin-left: 4px; }
.changes { display: flex; flex-wrap: wrap; gap: 6px 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
.changes .delta { margin: 0; font-size: .85rem; }
.text.mono p { font-size: 1.04rem; line-height: 1.95; color: #f3ead6; }
.text.mono p:last-child { color: var(--amber); font-family: var(--f-display); font-weight: 700; }
.choice .cost { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; }
.choice .cost .delta { margin: 0; font-size: .76rem; }
.choice.next .cost { justify-content: center; }
.delta.fate { color: var(--amber); }
.delta.up { color: var(--green); } .delta.down { color: var(--cinnabar); }

.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.scene .inner { padding: 22px 22px 18px; display: grid; gap: 12px; }
.art { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--bg); }
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, var(--panel) 100%); }
.eyebrow { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--amber); letter-spacing: .08em; }
.eyebrow .ref { color: var(--dim); letter-spacing: 0; }
.scene h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.text p { margin: 0 0 .7em; }
.text p:last-child { margin-bottom: 0; }
.say { border-left: 2px solid var(--amber); padding-left: 12px; }
.say .who { display: block; font-size: .8rem; color: var(--amber); font-weight: 700; }
.note { font-size: .86rem; color: var(--dim); }
details.src { border-top: 1px dashed var(--line); padding-top: 8px; }
details.src summary { cursor: pointer; font-size: .82rem; color: var(--dim); }
details.src .han { font-family: var(--f-han); font-size: 1.05rem; line-height: 1.9; margin: 6px 0 2px; color: var(--paper); }
details.src .pg { font-size: .76rem; color: var(--dim); }

.choices { display: grid; gap: 10px; }
.choice { text-align: left; background: transparent; color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; line-height: 1.55; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--amber); background: rgba(212,155,60,.06); }
.choice small { display: block; color: var(--dim); font-size: .78rem; margin-top: 2px; }
.choice.next { text-align: center; color: var(--amber); }

.ending { border-color: var(--amber); }
.ending .kind { font-size: .78rem; padding: 1px 8px; border-radius: 3px; border: 1px solid currentColor; width: fit-content; }
.kind.hist { color: var(--amber); } .kind.if { color: var(--green); } .kind.dead { color: var(--cinnabar); }
.fact { background: rgba(0,0,0,.18); border-radius: 4px; padding: 10px 12px; font-size: .9rem; }
.fact b { color: var(--amber); }

.book { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.book div { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: .85rem; }
.book .got { border-color: var(--amber); }
.book .no { color: var(--dim); }
footer { font-size: .76rem; color: var(--dim); text-align: center; }
@media (max-width: 480px) {
  .scene .inner { padding: 16px 16px 16px; }
  .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
  .stat .lab { font-size: .72rem; }
  .book { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .scene { animation: none !important; } }
.scene { animation: rise .35s ease both; }
/* 인트로 화면 */
.cover .art { aspect-ratio: 4 / 3; }
.cover .art::after { background: linear-gradient(to bottom, rgba(15,32,29,.15) 30%, var(--panel) 100%); }
.cover .mast { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 1; text-align: center; padding: 0 16px; }
.cover .mast .han { font-family: var(--f-han); font-weight: 700; color: var(--amber); font-size: clamp(2.6rem, 11vw, 4.2rem); letter-spacing: .18em; line-height: 1.1; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
.cover .mast .ko { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .3em; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.cover .lede { font-size: 1.02rem; }
.cast { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cast div { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: .86rem; line-height: 1.5; }
.cast b { display: block; font-family: var(--f-display); color: var(--amber); }
.how { margin: 0; padding-left: 1.1em; font-size: .9rem; color: var(--dim); }
.how li { margin-bottom: .3em; } .how b { color: var(--paper); }
.cover h3 { font-family: var(--f-display); font-size: .95rem; margin: 4px 0 0; color: var(--amber); letter-spacing: .1em; }
.choice.start { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; color: var(--bg); background: var(--amber); border-color: var(--amber); }
.choice.start:hover { background: #e2ad52; }
@media (max-width: 480px) { .cast { grid-template-columns: 1fr; } }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }

/* ---------- 미연시 화면 ---------- */
.vn { position: relative; height: clamp(520px, 76vh, 660px); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #050a09; cursor: pointer; user-select: none; -webkit-user-select: none; animation: rise .35s ease both; }
.vn .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.72) saturate(.9); }
.vn::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 18%, transparent 55%, rgba(0,0,0,.55) 100%); }
.sprites { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.sprite { position: absolute; bottom: 0; left: 50%; height: 90%; aspect-ratio: 1 / 1; transform: translateX(-50%); filter: drop-shadow(0 6px 22px rgba(0,0,0,.65)); animation: appear .45s ease both; }
.sprite.l { left: 30%; } .sprite.r { left: 70%; }
@keyframes appear { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
.place { position: absolute; z-index: 3; top: 10px; left: 12px; right: 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--amber); letter-spacing: .06em; text-shadow: 0 1px 6px #000; }
.place b { font-family: var(--f-display); font-size: .95rem; color: var(--paper); letter-spacing: .02em; }
.vn.ev .place span { color: var(--cinnabar); }
.srcbtn { margin-left: auto; background: rgba(10,22,20,.7); color: var(--paper); cursor: pointer; }
.srcpop { position: absolute; z-index: 4; top: 40px; left: 12px; right: 12px; background: rgba(10,22,20,.94); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: default; }
.srcpop .han { font-family: var(--f-han); font-size: 1.05rem; line-height: 1.9; }
.srcpop .pg { font-size: .76rem; color: var(--dim); }
.box { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 12px; min-height: 22%; max-height: 62%; overflow-y: auto; background: rgba(9,20,18,.88); border: 1px solid rgba(212,155,60,.45); border-radius: 6px; padding: 16px 18px 26px; box-shadow: 0 -6px 30px rgba(0,0,0,.4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.name { display: inline-block; margin: -8px 0 8px; background: var(--amber); color: #1a1206; font-family: var(--f-display); font-weight: 800; font-size: .88rem; padding: 1px 12px; border-radius: 3px; }
.name[hidden] { display: none; }
.line { font-size: 1.02rem; line-height: 1.85; white-space: pre-wrap; }
.line.note { color: var(--dim); font-size: .9rem; }
.line.mono { font-style: normal; color: #f3ead6; }
.line .changes { margin-top: 10px; white-space: normal; }
.more { position: absolute; right: 14px; bottom: 6px; color: var(--amber); font-size: .7rem; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.menu { position: absolute; z-index: 5; inset: 0; background: linear-gradient(to bottom, rgba(6,14,12,.25), rgba(6,14,12,.78) 45%); display: flex; overflow-y: auto; padding: 44px 16px 16px; cursor: default; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.menu[hidden], .srcpop[hidden], .more[hidden] { display: none; }
.menu-in { margin: auto 0; width: 100%; display: grid; gap: 10px; }
.menu .choice { background: rgba(22,46,41,.94); }
.menu .choice:hover { background: rgba(40,62,50,.96); }
.menu .choice:disabled { background: rgba(22,46,41,.6); }
.endcard { background: rgba(22,46,41,.95); border: 1px solid var(--amber); border-radius: 6px; padding: 18px; display: grid; gap: 10px; }
.endcard h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; }
@media (max-width: 480px) {
  .vn { height: clamp(520px, 78vh, 640px); }
  .sprite { height: 78%; } .sprite.l { left: 26%; } .sprite.r { left: 74%; }
  .box { left: 8px; right: 8px; bottom: 8px; padding: 14px 14px 24px; }
  .line { font-size: .96rem; }
}
@media (prefers-reduced-motion: reduce) { .sprite, .vn { animation: none; } .more { animation: none; } }
</style>
<meta name="description" content="천명(天命) — 《자치통감》 현무문의 변(626)을 바탕으로 한 미연시 선택지 게임">
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="logo"><span>天命</span>천명</h1>
    <div class="tools">
      <button class="ghost" id="btn-book" type="button">엔딩 도감</button>
      <button class="ghost" id="btn-restart" type="button">처음부터</button>
    </div>
  </header>
  <section class="hud" aria-label="수치">
    <div class="stat s-hp"><div class="lab">체력 <b id="v-hp"></b></div><div class="bar"><i id="b-hp"></i></div></div>
    <div class="stat s-gold"><div class="lab">재정 <b id="v-gold"></b></div><div class="bar"><i id="b-gold"></i></div></div>
    <div class="stat s-army"><div class="lab">군사력 <b id="v-army"></b></div><div class="bar"><i id="b-army"></i></div></div>
    <div class="stat s-fame"><div class="lab">명망 <b id="v-fame"></b></div><div class="bar"><i id="b-fame"></i></div></div>
  </section>
  <main id="stage"></main>
  <footer>천명(天命) — 《자치통감》 권191 무덕 9년(626) 강독 자료를 바탕으로 만든 선택지 게임. 화면을 누르거나 Space·Enter로 대사를 넘깁니다. '사료 보기'의 쪽수는 강독 사료 PDF 기준입니다.</footer>
</div>

<script>
const START = { hp: 70, gold: 50, army: 50, fame: 60 };
const STATS = ["hp", "gold", "army", "fame"];
let S, cur, pending = null;

function reset() { S = Object.assign({}, START, { jingde: true, summon: false, intel: false, strategists: true, evs: 0, seen: [] }); pending = null; }
const clamp = v => Math.max(0, Math.min(100, v));

/* ---------- 장면 ----------
   text: 문단 배열. {who, line} 은 대사.
   src: [사료 번호, 원문, 쪽]
   choices: label, sub(작은 설명), need(필요 수치 {gold, fame…}), eff(수치), set(상태), res(결과 문단), go(다음 장면 id 또는 함수) */
const N = {
  /* ---------- 독백 (게임용 창작) ---------- */
  mono1: {
    mono: true, date: "독백", place: "장안 · 서궁, 깊은 밤", title: "나는 이세민이다",
    text: [
      "잠이 오지 않는 밤이면 나는 칼을 닦는다. 이 칼로 나는 아버지의 천하를 열었다.",
      "진양에서 아버지께 군사를 일으키자고 했을 때, 세상은 아직 수나라의 것이었다. 그 뒤 나는 쉬지 않고 싸웠다. 서쪽에서 설인고를, 북쪽에서 송금강을 무찔렀고, 낙양에서는 왕세충과 두건덕을 한 번에 사로잡았다. 아버지는 나를 위해 천책상장(天策上將)이라는, 전에 없던 이름까지 만들어 주셨다.",
      "그런데 나는 왜 이 밤에 잠들지 못하는가."
    ],
    choices: [{ label: "…", next: true, go: "mono2" }]
  },
  mono2: {
    mono: true, date: "독백", place: "장안 · 서궁, 깊은 밤", title: "한 도성의 두 궁",
    text: [
      "황태자는 형 건성이다. 맏아들이니 그 자리가 형의 것이라는 데에는 나도 할 말이 없다. 형은 동궁에, 나는 서궁에 산다. 걸어서 반나절도 안 되는 거리인데, 요즘은 천 리보다 멀다.",
      "아우 원길은 형의 편에 섰다. 사냥터에서, 연회에서, 후궁의 치맛자락 뒤에서, 그들은 내 이름을 조금씩 갉아 먹는다. 아버지는 세 아들 사이에서 어느 쪽 손도 놓지 못하신다. 그것이 아버지의 사랑이라는 것을 안다. 그리고 그 사랑이 우리 형제를 천천히 죽이고 있다는 것도.",
      "내 곁에는 아직 사람들이 있다. 방현령과 두여회는 내 머리가 되고, 울지경덕과 정지절은 내 칼이 되며, 장손무기는 아내의 오라비이자 내 그림자다. 동궁은 그들을 하나씩 내게서 떼어 내려 한다."
    ],
    choices: [{ label: "…", next: true, go: "mono3" }]
  },
  mono3: {
    mono: true, date: "독백", place: "장안 · 서궁, 새벽", title: "천명은 어디에 있는가",
    text: [
      "옛사람들은 하늘이 천하를 맡길 사람을 고른다고 했다. 그것을 천명이라 불렀다. 그렇다면 하늘은 공을 세운 아들을 골랐는가, 먼저 태어난 아들을 골랐는가.",
      "나는 형을 미워하지 않는다. 적어도 그렇게 믿고 싶다. 다만 한 가지는 분명하다. 이대로 가면 형과 나, 둘 중 하나는 살아서 다음 봄을 보지 못한다.",
      "창밖이 희부옇게 밝아 온다. 누군가 서궁 문을 두드린다. 동궁에서 사람이 왔다고 한다.",
      "무덕 9년(626) 봄. 이제부터 고르는 것은 당신이다."
    ],
    choices: [{ label: "문을 연다", next: true, go: "intro" }]
  },
  intro: {
    date: "무덕 9년(626) 봄", place: "장안 · 서궁", title: "동궁에서 온 초대",
    text: [
      "당나라를 세우는 데 가장 큰 공을 세운 사람은 당신, 진왕 이세민이다. 그러나 황태자는 형 건성이고, 동생 제왕 원길은 형 편에 섰다. 아버지 고조는 세 아들 사이에서 머뭇거린다.",
      "하늘의 뜻은 누구에게 있는가. 아무도 소리 내어 묻지 못하는 그 물음이 장안의 밤을 무겁게 누른다.",
      "어느 밤, 동궁에서 사람이 왔다. 태자가 함께 술을 마시자고 부른다."
    ],
    choices: [
      { label: "형의 초대에 응한다", eff: { gold: -5, fame: 5 }, go: "poison" },
      { label: "몸이 좋지 않다며 사양한다", eff: { fame: -5 },
        res: ["사양의 말은 곧 동궁에 전해졌다. '진왕이 태자를 의심한다'는 말이 궁중에 돈다. 며칠 뒤 아버지가 서궁으로 찾아왔다. 피한 잔은 다른 모습으로 다시 돌아온다. 운명이란 그런 것이다."], go: "offer" }
    ]
  },
  poison: {
    date: "무덕 9년 봄", place: "동궁 → 서궁", title: "독주",
    text: [

  purge: ["shimin"], turk: ["yuanji"], fangdu: ["fang", "du"], taibai: ["gaozu"], june4: ["jiancheng", "yuanji"],
  linhu: () => S.jingde ? ["yuanji", "jingde"] : ["yuanji"], haichi: ["gaozu"],
  end_history: ["gaozu", "jingde"], end_luoyang: ["shimin"], end_kunming: ["jiancheng"], end_linhu: ["yuanji"], end_gate: ["shimin"],
  end_closed: ["jiancheng"], end_rebel: ["shimin"], end_hesitate: ["shimin"], end_sick: ["shimin"], end_haichi: ["gaozu"],
  ev_silk: ["shimin"], ev_revolt: ["shimin"], ev_plague: ["shimin"], ev_horse: ["shimin"], ev_hunt: ["yuanji"], ev_drought: ["shimin"]
};
const charSrc = k => `assets/char_${k}.png`;
Object.keys(CHAR).forEach(k => { const im = new Image(); im.src = charSrc(k); });

/* 문단 배열 → 한 줄씩 넘기는 대사 목록 */
function toLines(arr, cast, mono) {
  return arr.map(t => typeof t === "string" ? { text: t, chars: cast, name: mono ? "이세민" : "", mono }
    : t.note ? { text: t.note, chars: cast, note: true }
    : { text: t.line, name: t.who, chars: WHO[t.who] ?? cast });
}
function srcBox(src) {
  if (!src) return "";
  return `<div class="srcpop" hidden><div class="han" lang="zh-Hant">${esc(src[1])}</div><div class="pg">${esc(src[0])} · 《자치통감》 권191, ${esc(src[2])}</div></div>`;
}

/* ---------- 미연시 화면 ---------- */
let vn = null;   // { lines, i, done, typing, timer }
const slow = () => window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

function frame(id) {
  const n = N[id];
  $("stage").innerHTML = `<div class="vn${n.ev ? " ev" : ""}" id="vn">
    <img class="bg" src="${artSrc(ART[id] || shown)}" alt="">
    <div class="place"><span>${esc(n.date || n.tag || "")}${n.place ? " · " + esc(n.place) : ""}</span><b>${esc(n.title)}</b>${n.src ? `<button class="ghost srcbtn" id="srcbtn" type="button">사료 ${esc(n.src[0])}</button>` : ""}</div>
    ${srcBox(n.src)}
    <div class="sprites" id="sprites"></div>
    <div class="box" id="box"><div class="name" id="name" hidden></div><div class="line" id="line"></div><div class="more" id="more">▼</div></div>
    <div class="menu" id="menu" hidden></div>
  </div>`;
  shown = ART[id] || shown;
  $("vn").onclick = e => { if (!e.target.closest("button, .menu, .srcpop")) advance(); };
  if (n.src) $("srcbtn").onclick = () => { const p = $("stage").querySelector(".srcpop"); p.hidden = !p.hidden; };
}
function setSprites(chars) {
  const el = $("sprites"), key = chars.join(",");
  if (el.dataset.k === key) return;
  el.dataset.k = key;
  el.innerHTML = chars.map((k, i) => `<img class="sprite${chars.length > 1 ? (i ? " r" : " l") : ""}" src="${charSrc(k)}" alt="${esc(CHAR[k])}">`).join("");
}
function play(lines, done, extra = "") {
  clearInterval(vn?.timer);
  vn = { lines, i: 0, done, extra };
  $("menu").hidden = true;
  show();
}
function show() {
  const L = vn.lines[vn.i];
  setSprites(L.chars || []);
  const nm = $("name");
  nm.hidden = !L.name; nm.textContent = L.name || "";
  const line = $("line");
  line.className = "line" + (L.note ? " note" : "") + (L.mono ? " mono" : "");
  const last = vn.i === vn.lines.length - 1;
  const tail = last && vn.extra ? vn.extra : "";
  $("more").hidden = true;
  if (slow()) { line.innerHTML = esc(L.text) + tail; vn.typing = false; $("more").hidden = false; return; }
  let k = 0; vn.typing = true;
  line.textContent = "";
  vn.timer = setInterval(() => {
    k += 2; line.textContent = L.text.slice(0, k);
    if (k >= L.text.length) finish();
  }, 28);
  function finish() { clearInterval(vn.timer); vn.typing = false; line.innerHTML = esc(L.text) + tail; $("more").hidden = false; }
  vn.finish = finish;
}
function advance() {
  if (!vn || !$("vn") || !$("menu").hidden) return;
  if (vn.typing) return vn.finish();
  if (vn.i < vn.lines.length - 1) { vn.i++; show(); }
  else { const f = vn.done; vn.done = null; f && f(); }
}
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && $("vn") && e.target.tagName !== "BUTTON") { e.preventDefault(); advance(); }
});
function openMenu(html) {
  $("more").hidden = true;
  const m = $("menu"); m.innerHTML = `<div class="menu-in">${html}</div>`; m.hidden = false;
  return m;
}

function render(id, d = {}) {
  cur = id;
  const n = N[id];
  paintHud(d);
  frame(id);
  const cast = val(CAST[id]) || [];
  if (n.end) {
    saveGot(id);
    play(toLines(n.text, cast), () => {
      openMenu(`<div class="endcard"><span class="kind ${n.kind}">${esc(n.tag)}</span><h2>${esc(n.title)}</h2>
        <div class="fact"><b>실제로는</b> ${esc(n.fact)}</div>
        <div class="note">관련 사료: ${esc(n.refs)} · 모은 엔딩 ${loadGot().length} / ${ENDS.length}</div></div>
        <button class="choice next" id="again" type="button">처음부터 다시</button>`);
      $("again").onclick = restart;
    });
    return;
  }
  play(toLines(val(n.text), cast, n.mono), () => {
    const m = openMenu(n.choices.map((c, i) => {
      const need = Object.entries(c.need || {});
      const poor = need.some(([k, v]) => S[k] < v);
      const sub = [need.map(([k, v]) => `${NAME[k]} ${v} 필요`).join(" · ") + (poor ? " · 부족" : ""), c.sub || ""].filter(Boolean).join(" · ");
      const cost = typeof c.eff === "function" ? `<span class="delta fate">결과는 하늘에 달렸다</span>`
        : STATS.filter(k => c.eff?.[k]).map(k => `<span class="delta ${c.eff[k] > 0 ? "up" : "down"}">${NAME[k]} ${c.eff[k] > 0 ? "+" : ""}${c.eff[k]}</span>`).join("");
      return `<button class="choice${c.next ? " next" : ""}" data-i="${i}" type="button"${poor ? " disabled" : ""}>${esc(c.label)}${sub ? `<small>${esc(sub)}</small>` : ""}${cost ? `<span class="cost">${cost}</span>` : ""}</button>`;
    }).join(""));
    m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => pick(n.choices[+b.dataset.i]));
  });
}

function pick(c) {
  const d = {};
  const res = val(c.res);           // 결과 문단은 수치 변경 전 상태로 판단
  let go = val(c.go);
  const eff = val(c.eff) || {};
  for (const k in eff) { const before = S[k]; S[k] = clamp(S[k] + eff[k]); d[k] = S[k] - before; }
  Object.assign(S, c.set || {});
  if (S.hp <= 0) go = "end_sick";
  else go = maybeEvent(go);
  if (!res) return render(go, d);
  const from = cur;
  cur = go;
  paintHud(d);
  play(toLines(res, val(CAST[from]) || []), () => render(go), change(d));
}

const NAME = { hp: "체력", gold: "재정", army: "군사력", fame: "명망" };
function change(d) {
  const t = STATS.filter(k => d[k]).map(k => `<span class="delta ${d[k] > 0 ? "up" : "down"}">${NAME[k]} ${d[k] > 0 ? "+" : ""}${d[k]}</span>`);
  return t.length ? `<div class="changes">${t.join("")}</div>` : "";
}
function maybeEvent(go) {
  if (N[cur]?.ev || !EV_SLOTS.includes(go) || S.evs >= EV_MAX || Math.random() > 0.6) return go;
  const left = Object.keys(EV).filter(k => !S.seen.includes(k));
  if (!left.length) return go;
  const k = left[Math.floor(Math.random() * left.length)];
  S.evs++; S.seen.push(k); pending = go;
  return k;
}

function book() {
  const got = new Set(loadGot());
  $("stage").innerHTML = `<article class="scene">${art("title")}<div class="inner"><h2>엔딩 도감</h2>
    <p class="note">${got.size} / ${ENDS.length} · 이 브라우저에만 기록됩니다.</p>
    <div class="book">${ENDS.map(k => got.has(k)
      ? `<div class="got"><b>${esc(N[k].title)}</b><br><span class="note">${esc(N[k].tag)}</span></div>`
      : `<div class="no">？？？<br><span class="note">${esc(N[k].tag)}</span></div>`).join("")}</div>
  </div></article>
  <div class="choices" style="margin-top:12px"><button class="choice next" id="back" type="button">돌아가기</button></div>`;
  $("back").onclick = () => cur === "cover" ? cover() : render(cur);
}

function cover() {
  reset(); cur = "cover";
  const got = loadGot().length;
  paintHud();
  $("stage").innerHTML = `<article class="scene cover"><div class="art"><img src="${artSrc("title")}" alt=""><div class="mast"><div class="han" lang="zh-Hant">天命</div><div class="ko">천명 · 현무문 626</div></div></div><div class="inner">
    <div class="eyebrow"><span>무덕 9년(626)</span><span>당 · 장안</span></div>
    <p class="lede">618년, 이연(고조)이 수나라를 무너뜨리고 당을 세웠다. 전장에서 군웅을 하나씩 꺾은 것은 둘째 아들 진왕 이세민이었다. 그러나 황태자는 맏아들 건성이고, 넷째 원길은 형의 편에 섰다.</p>
    <p>옛사람들은 하늘이 천하를 맡길 사람을 정한다고 믿었다. 그것을 천명(天命)이라 불렀다. 그렇다면 공은 한 사람에게 쌓였는데 자리가 다른 사람에게 있을 때, 하늘의 뜻은 어디에 있는가.</p>
    <p> 무덕 9년 봄, 장안의 두 궁전 사이에 흐르는 공기가 날로 차가워진다. 당신은 이세민이다. 6월 4일 새벽 현무문에 이르기까지, 무엇을 고르겠는가.</p>
    <h3>등장인물</h3>
    <div class="cast">
      <div><b>이세민 · 진왕</b>당신. 서궁에 머문다. 공은 가장 크지만 후계자는 아니다.</div>
      <div><b>이연 · 고조</b>아버지이자 황제. 세 아들 사이에서 결단을 미룬다.</div>
      <div><b>이건성 · 황태자</b>맏형. 동궁의 주인. 아우의 공이 두렵다.</div>
      <div><b>이원길 · 제왕</b>아우. 건성 편에 서서 세민을 없애자고 재촉한다.</div>
    </div>
    <h3>하는 법</h3>
    <ul class="how">
      <li>거의 모든 선택에는 대가가 따른다. <b>체력</b>이 0이 되면 쓰러지고, <b>재정</b>이나 <b>명망</b>이 모자라면 고를 수 없는 선택지가 있다.</li>
      <li><b>명망</b>이 가장 중요하다. 아버지와 조정을 설득하고, 경덕을 살리고, 현무문의 군사를 움직이는 데 모두 명망이 쓰인다. 명망은 쓰면 줄어든다.</li>
      <li>중간에 <b>돌발 사건</b>이 끼어든다. 빨간 표시가 붙은 사건은 사료에 없는 가상의 일이다.</li>
      <li>장면마다 '사료 보기'를 열면 《자치통감》 원문과 쪽수가 나온다. 결말은 ${ENDS.length}개, 지금까지 ${got}개를 모았다.</li>
    </ul>
  </div></article>
  <div class="choices" style="margin-top:12px"><button class="choice start" id="go" type="button">시작하기</button></div>`;
  $("go").onclick = () => { render("mono1"); window.scrollTo({ top: 0 }); };
}
function restart() { cover(); window.scrollTo({ top: 0 }); }
$("btn-restart").onclick = restart;
$("btn-book").onclick = book;

function start(data) {
  if (data && data.S && data.cur && N[data.cur] && "hp" in data.S) { S = data.S; pending = data.pending || null; render(data.cur); }
  else restart();
}
window.claude?.hot?.snapshot?.(() => ({ S, cur, pending }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
